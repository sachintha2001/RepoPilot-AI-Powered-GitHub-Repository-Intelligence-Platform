name: RepoPilot CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: FastAPI Backend & AI Pipeline Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite (TC-01 through TC-08)
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_repopilot.db
          SECRET_KEY: ci-test-secret-key
        run: pytest tests -v

  frontend-check:
    name: Next.js Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

